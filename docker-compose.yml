services:
  # ============================================================
  # OBSERVABILITY STACK (starts first)
  # ============================================================
  
  loki:
    image: grafana/loki:3.0.0
    container_name: loki
    expose:
      - "3100"
    volumes:
      - ./Observability/loki-config.yaml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - ams-observability
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  tempo:
    image: grafana/tempo:2.4.0
    container_name: tempo
    expose:
      - "3200"
      - "4317"
      - "4318"
    volumes:
      - ./Observability/tempo-config.yaml:/etc/tempo/config.yaml
      - tempo_data:/var/tempo
    command: ["-config.file=/etc/tempo/config.yaml"]
    networks:
      - ams-observability
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3200/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    expose:
      - "9090"
    volumes:
      - ./Observability/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"
      - "--storage.tsdb.retention.time=30d"
    networks:
      - ams-observability
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana-oss:10.4.0
    container_name: grafana
    ports:
      - "${GRAFANA_PUBLISH_PORT:-11200}:3000"
    env_file: ./Observability/.env.observability
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - GF_SMTP_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./Observability/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      loki: { condition: service_healthy }
      tempo: { condition: service_healthy }
      prometheus: { condition: service_healthy }
    networks:
      - ams-observability
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.1.0
    container_name: alloy
    ports:
      - "${OTLP_HTTP_PUBLISH_PORT:-4318}:4318"
    expose:
      - "12345"
      - "4317"
    command: run /etc/alloy/config.alloy
    env_file: ./Observability/.env.observability
    volumes:
      - ./Observability/alloy/config.alloy:/etc/alloy/config.alloy
      - ./logs:/app/logs:ro
    depends_on:
      loki: { condition: service_healthy }
      tempo: { condition: service_healthy }
      prometheus: { condition: service_healthy }
    networks:
      - ams-observability
    restart: unless-stopped

  # ============================================================
  # APPLICATION STACK (depends on observability being healthy)
  # ============================================================

  postgres:
    image: postgres:15-alpine
    container_name: ams-postgres-docker
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assetmanager_db}
      POSTGRES_USER: ${POSTGRES_USER:-assetmanager_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-my-password}
    volumes:
      - ${POSTGRES_DATA_PATH:-./DB/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-assetmanager_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ams-observability
    restart: unless-stopped

  server:
    build:
      context: ./Server
      dockerfile: Dockerfile
    container_name: ams-server
    depends_on:
      postgres:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    environment:
      # Database Connection
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-assetmanager_db}
      POSTGRES_USER: ${POSTGRES_USER:-assetmanager_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-my-password}
      
      # Frontend URLs
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:11000}
      VITE_FRONTEND_URL: ${FRONTEND_URL:-http://localhost:11000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:11000,http://localhost:11100,http://115.241.70.253:10100}
      
      # Authentication
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-}
      AUTH_ISSUER: ${AUTH_ISSUER:-}
      AUTH_PROJECT_ID: ${AUTH_PROJECT_ID:-}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-}
      AUTH_CLOCK_SKEW_SECONDS: 30
      
      # Environment
      ENV: ${ENV:-local}
      VITE_ENV: ${ENV:-local}
      
      # Observability
      OTEL_GRAFANA_ENABLED: ${OTEL_GRAFANA_ENABLED:-true}
      LOKI_BASE_URL: ${LOKI_BASE_URL:-http://loki:3100}
      
      # Email Service
      EMAIL_SERVICE_URL: ${EMAIL_SERVICE_URL:-}
      BACKEND_API_KEY_EMAIL_NOTIFICATION: ${BACKEND_API_KEY_EMAIL_NOTIFICATION:-}
      NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-true}
      
      # API Key
      BACKEND_API_KEY: ${BACKEND_API_KEY:-}
      VITE_BACKEND_API_KEY: ${BACKEND_API_KEY:-}
      
      # Role Bootstrap Secret
      ROLE_BOOTSTRAP_SECRET: ${ROLE_BOOTSTRAP_SECRET:-}
    ports:
      - "${SERVER_PUBLISH_PORT:-11100}:8000"
    networks:
      - ams-observability
    restart: unless-stopped

  client:
    build:
      context: ./Client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:11100}
        VITE_BACKEND_API_KEY: ${BACKEND_API_KEY:-}
        VITE_AUTH_AUTHORITY: ${VITE_AUTH_AUTHORITY:-}
        VITE_CLIENT_ID: ${VITE_CLIENT_ID:-}
        VITE_ORG_ID: ${VITE_ORG_ID:-}
        VITE_PROJECT_ID: ${VITE_PROJECT_ID:-}
        VITE_CALLBACK_PATH: ${VITE_CALLBACK_PATH:-/callback}
        VITE_LOGOUT_PATH: ${VITE_LOGOUT_PATH:-/login}
        VITE_FRONTEND_URL: ${FRONTEND_URL:-http://localhost:11000}
        VITE_PUBLIC_APP_ORIGIN: ${VITE_PUBLIC_APP_ORIGIN:-http://localhost:11000}
        VITE_OTEL_GRAFANA_ENABLED: ${VITE_OTEL_GRAFANA_ENABLED:-false}
        VITE_OTEL_EXPORTER_ENDPOINT: ${VITE_OTEL_EXPORTER_ENDPOINT:-http://localhost:4318/v1/traces}
        VITE_GRAFANA_DASHBOARD_URL_FOR_ITOPS: ${VITE_GRAFANA_DASHBOARD_URL_FOR_ITOPS:-}
    container_name: ams-client
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${CLIENT_PUBLISH_PORT:-11000}:80"
    networks:
      - ams-observability
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ams-pgadmin
    depends_on:
      - postgres
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PUBLISH_PORT:-11300}:80"
    networks:
      - ams-observability
    restart: unless-stopped

networks:
  ams-observability:
    name: ams-observability
    driver: bridge

volumes:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:
